# Local PostgreSQL for development.
# SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5433/ecom
# SPRING_DATASOURCE_USERNAME=ecom  SPRING_DATASOURCE_PASSWORD=ecom
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecom
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
